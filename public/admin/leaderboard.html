<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leaderboard | ClubPoint</title><link rel="stylesheet" href="/css/tokens.css" /><link rel="stylesheet" href="/css/base.css" /></head>
<body><div id="adminShell"></div><main class="page"><div class="page-heading"><p class="eyebrow">Publication</p><h1>Leaderboard</h1><p class="muted">Control when rankings are visible and which approved fields are public.</p></div><section class="card"><form id="leaderboardForm" class="stack"><label>Visibility<select name="visibility"><option value="private">Private</option><option value="published">Published</option><option value="scheduled">Scheduled</option></select></label><label>Publish at<input name="publishAt" type="datetime-local" /></label><label>Unpublish at<input name="unpublishAt" type="datetime-local" /></label><fieldset><legend>Approved public fields</legend><label><input type="checkbox" name="publicFields" value="fullName" /> Full name</label><label><input type="checkbox" name="publicFields" value="memberId" /> Member ID</label><label><input type="checkbox" name="publicFields" value="department" /> Department</label><label><input type="checkbox" name="publicFields" value="profileImageUrl" /> Profile image</label><label><input type="checkbox" name="publicFields" value="memberType" /> Member type</label><label><input type="checkbox" name="publicFields" value="totalPoints" /> Total points</label></fieldset><label><input type="checkbox" name="showCategoryRankings" /> Enable category filters</label><label>Tie handling<select name="tieHandling"><option value="competition">Competition (1, 2, 2, 4)</option><option value="dense">Dense (1, 2, 2, 3)</option><option value="none">No tied ranks</option></select></label><button type="submit">Save publication settings</button></form><p id="leaderboardMsg" class="msg" role="status"></p></section><section class="card"><h2>Preview</h2><div class="table-wrap"><table><thead id="previewHead"></thead><tbody id="previewRows"></tbody></table></div></section></main><script src="/js/api.js"></script><script src="/js/admin-shell.js"></script><script src="/js/admin-leaderboard.js"></script></body></html>
