<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Awards | ClubPoint</title><link rel="stylesheet" href="/css/tokens.css" /><link rel="stylesheet" href="/css/base.css" /></head>
<body><div id="adminShell"></div><main class="page"><div class="page-heading"><p class="eyebrow">Point ledger</p><h1>Awards</h1><p class="muted">Award points individually or in bulk. Every change requires a reason and is recorded against your administrator account.</p></div>
<div class="content-grid">
<section class="card"><h2>Individual award</h2><form id="individualForm" class="stack"><label>Search member<input id="individualSearch" type="search" autocomplete="off" placeholder="Type a name or member ID" required /></label><div id="individualMatches" class="search-matches" role="listbox" aria-label="Matching members"></div><input type="hidden" name="memberId" id="individualMember" required /><p id="individualSelected" class="selected-member muted">No member selected.</p><label>Criterion<select name="criterionId" id="individualCriterion" required></select></label><label>Reason or note<textarea name="reason" rows="3" maxlength="500" required></textarea></label><button type="submit">Award points</button></form></section>
<section class="card"><h2>Bulk award</h2><form id="bulkForm" class="stack"><label>Criterion<select name="criterionId" id="bulkCriterion" required></select></label><label>Search members<input id="bulkSearch" type="search" autocomplete="off" placeholder="Type a name or member ID" /></label><div id="bulkMatches" class="search-matches" role="group" aria-label="Matching members"></div><div id="bulkSelected" class="selected-list"><p class="muted small">No members selected.</p></div><label>Reason or note<textarea name="reason" rows="3" maxlength="500" required></textarea></label><button type="submit">Award to selected members</button></form></section>
<section class="card"><h2>Reverse or correct</h2><form id="adjustForm" class="stack"><label>Ledger transaction<select name="transactionId" id="adjustTransaction" required></select></label><label>Action<select name="kind"><option value="reverse">Reverse original points</option><option value="correct">Add correction points</option></select></label><label>Correction points<input name="points" type="number" step=".01" placeholder="Required for correction" /></label><label>Reason or note<textarea name="reason" rows="3" maxlength="500" required></textarea></label><button type="submit">Apply ledger change</button></form></section>
</div><p id="awardMsg" class="msg" role="status"></p><section class="card"><h2>Recent ledger entries</h2><div id="ledgerRows" class="session-list"></div></section>
</main><script src="/js/api.js"></script><script src="/js/admin-shell.js"></script><script src="/js/admin-awards.js"></script></body></html>
