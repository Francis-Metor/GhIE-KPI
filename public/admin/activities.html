<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Activities | ClubPoint</title><link rel="stylesheet" href="/css/tokens.css" /><link rel="stylesheet" href="/css/base.css" /></head>
<body><div id="adminShell"></div><main class="page"><div class="page-heading"><p class="eyebrow">Attendance setup</p><h1>Activities</h1><p class="muted">Manage venues, locations, schedules, radius settings, and attendance windows.</p></div>
<div class="content-grid"><section class="card"><h2>Venues</h2><form id="venueForm" class="stack"><label>Name<input name="name" required /></label><label>Address<input name="address" /></label><label>Latitude<input name="latitude" type="number" min="-90" max="90" step="any" required /></label><label>Longitude<input name="longitude" type="number" min="-180" max="180" step="any" required /></label><label>Default radius (m)<input name="defaultRadiusMeters" type="number" min="10" max="5000" value="500" /></label><button type="submit">Add venue</button></form><div id="venueRows"></div></section>
<section class="card"><h2>Activities</h2><form id="activityForm" class="stack"><label>Title<input name="title" required /></label><label>Description<input name="description" /></label><label>Type<select name="type"><option value="meeting">Meeting</option><option value="event">Event</option><option value="course">Course</option><option value="training">Training</option><option value="other">Other</option></select></label><label>Venue<select name="venue" id="activityVenue" required></select></label><label>Start time<input name="startsAt" type="datetime-local" required /></label><label>End time<input name="endsAt" type="datetime-local" /></label><label>Radius override (m)<input name="radiusOverrideMeters" type="number" min="10" max="5000" placeholder="Uses venue default" /></label><label>Attendance criterion<select name="attendanceCriterion" id="attendanceCriterion"><option value="">None</option></select></label><fieldset><legend>Punctuality award (optional)</legend><label>Criterion<select name="punctualityCriterion" id="punctualityCriterion"><option value="">None</option></select></label><label>Time limit after activity start (minutes)<input name="punctualityWindowMinutes" type="number" min="1" max="1440" placeholder="Required when criterion is selected" /></label><p class="muted small">Members who submit within this limit receive both attendance and punctuality points.</p></fieldset><label>Attendance opens<input name="attendanceOpensAt" type="datetime-local" /></label><label>Attendance closes<input name="attendanceClosesAt" type="datetime-local" /></label><label>Status<select name="status"><option value="scheduled">Scheduled</option><option value="draft">Draft</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label><button type="submit">Add activity</button></form><div id="activityRows"></div></section></div><p id="activityMsg" class="msg" role="status"></p>
</main><script src="/js/api.js"></script><script src="/js/admin-shell.js"></script><script src="/js/admin-activities.js"></script></body></html>
