<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings | ClubPoint</title><link rel="stylesheet" href="/css/tokens.css" /><link rel="stylesheet" href="/css/base.css" /></head>
<body><div id="adminShell"></div><main class="page"><div class="page-heading"><p class="eyebrow">System configuration</p><h1>Settings</h1><p class="muted">Configure defaults used by new venues and QR attendance sessions.</p></div><section class="card"><form id="settingsForm" class="stack"><label>Default attendance radius (metres)<input name="attendanceRadiusMeters" type="number" min="10" max="5000" required /></label><label>Default QR session expiry (minutes)<input name="sessionExpiryMinutes" type="number" min="1" max="1440" required /></label><label>Maximum accepted GPS accuracy (metres)<input name="attendanceGpsAccuracyMaxMeters" type="number" min="1" max="1000" required /></label><button type="submit">Save settings</button></form><p id="settingsMsg" class="msg" role="status"></p></section><section class="card"><h2>Publication controls</h2><p class="muted">Leaderboard visibility and public fields are managed separately.</p><a class="button-link" href="/admin/leaderboard.html">Open leaderboard settings</a></section></main><script src="/js/api.js"></script><script src="/js/admin-shell.js"></script><script src="/js/admin-settings.js"></script></body></html>
