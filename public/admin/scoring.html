<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scoring | ClubPoint</title><link rel="stylesheet" href="/css/tokens.css" /><link rel="stylesheet" href="/css/base.css" /></head>
<body><div id="adminShell"></div><main class="page"><div class="page-heading"><p class="eyebrow">Point configuration</p><h1>Scoring</h1><p class="muted">Manage categories and criteria. Historical awards keep their original snapshot.</p></div>
<div class="content-grid"><section class="card"><h2>Categories</h2><form id="categoryForm" class="stack"><label>Name<input name="name" required /></label><label>Description<input name="description" /></label><label>Display order<input name="displayOrder" type="number" value="0" /></label><button type="submit">Add category</button></form><div id="categoryRows"></div></section>
<section class="card"><h2>Criteria</h2><form id="criterionForm" class="stack"><label>Name<input name="name" required /></label><label>Description<input name="description" /></label><label>Category<select name="category" id="criterionCategory" required></select></label><label>Points<input name="points" type="number" min=".01" step=".01" required /></label><label>Award method<select name="awardMethod"><option value="automatic">Automatic</option><option value="manual">Manual</option></select></label><label>Optional member limit<input name="awardLimit" type="number" min="1" step="1" /></label><button type="submit">Add criterion</button></form><div id="criterionRows"></div></section></div><p id="scoringMsg" class="msg" role="status"></p>
</main><script src="/js/api.js"></script><script src="/js/admin-shell.js"></script><script src="/js/admin-scoring.js"></script></body></html>
