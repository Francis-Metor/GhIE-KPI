<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Analytics | ClubPoint</title><link rel="stylesheet" href="/css/tokens.css" /><link rel="stylesheet" href="/css/base.css" /></head>
<body><div id="adminShell"></div><main class="page"><div class="page-heading"><p class="eyebrow">Admin analytics</p><h1>Member analytics</h1><p class="muted">Review ledger totals by member and category, then export the filtered report.</p></div>
<section class="card no-print"><form id="analyticsFilters" class="form-grid"><label>Search member<input name="search" placeholder="Name or member ID" /></label><label>Department<input name="department" placeholder="Department" /></label><label>Status<select name="status"><option value="active">Active members</option><option value="inactive">Inactive members</option><option value="all">All members</option></select></label><label>Category<select name="category" id="categoryFilter"><option value="">All categories</option></select></label><label>From<input name="from" type="date" /></label><label>To<input name="to" type="date" /></label><button type="submit">Apply filters</button></form><p id="analyticsMsg" class="msg" role="status"></p></section>
<section class="summary-grid" id="summaryCards"></section>
<div class="content-grid"><section class="card"><h2>Points by category</h2><div id="categoryChart" class="bar-chart"></div></section><section class="card"><h2>Top members</h2><div id="memberChart" class="bar-chart"></div></section></div>
<section class="card"><div class="section-heading"><h2>Member scores</h2><div class="no-print export-actions"><button type="button" id="exportCsv">Download CSV</button><button type="button" id="exportXlsx">Download Excel</button></div></div><div class="table-wrap"><table><thead id="scoreHead"></thead><tbody id="scoreBody"></tbody></table></div></section>
</main><script src="/js/api.js"></script><script src="/js/admin-shell.js"></script><script src="/js/admin-analytics.js"></script></body></html>
