<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My ClubPoint</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/member/index.html">ClubPoint</a>
    <span class="who" id="who"></span>
    <a id="leaderboardLink" class="member-nav-link" href="/leaderboard/index.html" hidden>Leaderboard</a>
    <button class="ghost" id="signOut">Sign out</button>
  </header>
  <main>
    <div class="card">
      <div class="member-profile-heading">
        <img id="profileImage" class="member-profile-image" alt="" hidden />
        <div>
          <h1 id="hello">Welcome</h1>
          <p id="imageNotice" class="muted small" hidden></p>
        </div>
      </div>
      <dl id="profile"></dl>
    </div>
    <section class="summary-grid" id="summaryCards"></section>
    <div class="content-grid">
      <section class="card"><h2>Points by category</h2><div id="categorySummary" class="bar-chart"></div></section>
      <section class="card"><h2>Attendance summary</h2><div id="attendanceSummary"></div></section>
    </div>
    <section class="card"><h2>Point transaction history</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Activity</th><th>Category</th><th>Type</th><th>Reason</th><th>Points</th></tr></thead><tbody id="transactionRows"></tbody></table></div></section>
    <section class="card"><h2>Attendance history</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Activity</th><th>Result</th><th>Distance</th><th>Details</th></tr></thead><tbody id="attendanceRows"></tbody></table></div></section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/member-home.js"></script>
</body>
</html>
